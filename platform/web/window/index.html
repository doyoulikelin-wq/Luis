<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ec">
  <meta name="color-scheme" content="light">
  <title>角色小窗 · Luis</title>
  <link rel="preload" href="./fonts/noto-sans-sc-ui.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='5' width='44' height='38' rx='11' fill='%2328282c'/%3E%3Cpath d='M8 34h32' stroke='%23b7b3c9' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./window.css">
</head>
<body>
  <header class="mast">
    <div class="brand" aria-label="Luis"><i class="brand-mark" aria-hidden="true"></i>Luis</div>
    <button type="button" class="help" id="open-help" aria-haspopup="dialog">手势说明 <span aria-hidden="true">?</span></button>
  </header>
  <main>
    <section class="preview" aria-labelledby="title">
      <h1 id="title">角色小窗</h1>
      <p id="hint">按住窗内，左右拖动，再突然折回。</p>
      <div id="window-surface" class="bezel" data-gesture="loading" aria-label="角色互动区" aria-describedby="hint">
        <canvas id="avatar" role="img" aria-label="蓝发角色从黑色窗口探出头，双手搭在窗沿上"></canvas>
      </div>
      <div class="feedback">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status" role="status" aria-live="polite">正在打开小窗</span>
        <button id="retry" type="button" hidden>重新加载</button>
      </div>
      <noscript>请启用 JavaScript 来体验触摸互动。</noscript>
    </section>
  </main>
  <dialog id="guide" aria-labelledby="guide-heading">
    <div class="dialog-head">
      <h2 id="guide-heading">触摸手势</h2>
      <form method="dialog"><button class="close" aria-label="关闭手势说明" autofocus>×</button></form>
    </div>
    <dl>
      <div><dt>点按</dt><dd>轻点脸颊或窗沿，看她回应。</dd></div>
      <div><dt>长按</dt><dd>按住同一点，等她靠近。</dd></div>
      <div><dt>长按拖拽</dt><dd>等她靠近后再拖动。中途折返，观察眼神和头部。</dd></div>
      <div><dt>滑动</dt><dd>碰到小窗就向一侧划过，看她往哪个方向瞥。</dd></div>
    </dl>
  </dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
